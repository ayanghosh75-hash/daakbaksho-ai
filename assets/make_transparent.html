<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; background: transparent; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c" width="1024" height="1024"></canvas>
  <script>
    const img = new Image();
    img.src = "file:///C:/Users/acer/.gemini/antigravity/brain/27dd60d4-c2f6-4497-93d0-72d3d8a8bae4/daakbaksho_isolated_icon_1794227594095.jpg";
    img.onload = () => {
      const c = document.getElementById('c');
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, 1024, 1024);
      
      const imgData = ctx.getImageData(0, 0, 1024, 1024);
      const data = imgData.data;
      
      // Make pure white and near-white pixels transparent with smooth falloff
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        
        // Check brightness
        if (r > 240 && g > 240 && b > 240) {
          // calculate distance to pure white
          const minVal = Math.min(r, g, b);
          if (minVal >= 252) {
            data[i+3] = 0; // completely transparent
          } else {
            // soft transition
            data[i+3] = Math.round((255 - minVal) / 12 * 255);
          }
        }
      }
      
      ctx.putImageData(imgData, 0, 0);
      window.__DONE = true;
    };
  </script>
</body>
</html>
